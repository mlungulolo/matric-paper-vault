# Save this in your repo as:  .github/workflows/scrape.yml
# It refreshes the official paper links every Monday (and whenever you tap "Run workflow").
name: Refresh paper links
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python scrape_dbe.py
      - name: Commit changes
        run: |
          git config user.name "link-bot"
          git config user.email "link-bot@users.noreply.github.com"
          git add papers_auto.json
          git diff --staged --quiet || git commit -m "Update paper links"
          git push
